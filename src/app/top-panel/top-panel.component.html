<nav class="top-panel">

  <img
    alt="Logo" width="136" height="35" class="logo" priority routerLink="/"
    [src]="isHovered ? 'public/logo_orange.svg' : 'public/CU-ONE.svg'"
    (mouseenter)="isHovered = true"
    (mouseleave)="isHovered = false"
  />

  @if (screenWidth() > 768) {
    <div class="nav-links">
      <a routerLink="/portfolio" routerLinkActive="active">{{ 'nav.portfolio' | t }}</a>
      <svg class="slash" viewBox="0 0 10 20" aria-hidden="true">
        <line x1="2" y1="60" x2="8" y2="2"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <a routerLink="/contacts" routerLinkActive="active">{{ 'nav.contacts' | t }}</a>
    </div>
    <div class="fake">
      <button class="language-button" type="button" (click)="toggleLanguage()">
        {{ languageButtonLabel }}
      </button>
    </div>
  } @else {
    <button class="hamburger"
            [class.is-active]="isMenuOpen()"
            (click)="toggleMenu()"
            [attr.aria-label]="'nav.toggleMenu' | t">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </button>
  }

</nav>

@if (isMenuOpen()) {
  <nav class="mobile-menu">
    <a (click)="navigate('/contacts')" routerLinkActive="active" class="text-mobile">{{ 'nav.contacts' | t }}</a>
    <a (click)="navigate('/portfolio')" routerLinkActive="active" class="text-mobile">{{ 'nav.portfolio' | t }}</a>
    <button class="text-mobile mobile-language-button" type="button" (click)="toggleLanguage()">
      {{ languageButtonLabel }}
    </button>
  </nav>
}
